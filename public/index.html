<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiZ</title>
<link rel="icon" href="wiz.svg" type="image/svg+xml">
<style>
:root { color-scheme: dark; --bg:#0a0e14; --card:#121826; --line:#223; --txt:#e8edf2; --mut:#8b95a7; --acc:#1d4ed8; }
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--txt); margin: 0; padding: 0; }
header { position: sticky; top: 0; z-index: 5; background: rgba(10,14,20,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 12px 16px; }
.hwrap { max-width: 430px; margin: 0 auto; display: flex; gap: 10px; align-items: center; padding: 0 16px; }
header h2 { margin: 0; font-size: 17px; margin-right: auto; }
.logo { height: 30px; margin-right: auto; }
#pill { font-size: 12px; color: var(--mut); background: #111826; border: 1px solid var(--line); padding: 4px 10px; border-radius: 99px; }
main { padding: 16px; max-width: 430px; margin: 0 auto; padding-bottom: 96px; }
#tabbar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 430px; margin: 0 auto; z-index: 40; display: flex; gap: 4px; background: rgba(10,14,20,.96); border-top: 1px solid var(--line); border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); backdrop-filter: blur(8px); }
#tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border: none; border-radius: 12px; background: transparent; color: var(--mut); font-size: 20px; cursor: pointer; }
#tabbar button small { font-size: 11px; font-weight: 700; }
#tabbar button.active { color: #fff; background: #1a2233; }
.room { background: #0b1119; border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 14px; }
.roomhead { padding: 0; }
.rrow { display: flex; align-items: center; gap: 10px; }
.rrow + .rrow { margin-top: 10px; }
.rrow input[type=range] { flex: 1; min-width: 0; }
.top .sp { flex: 1; }
.roomhead .t { font-size: 14px; color: var(--txt); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.roomhead .n { font-size: 12px; color: var(--mut); }
.roomhead .sp { flex: 1; }
.roomhead input[type=range] { flex: 1; min-width: 80px; }
.brow { display: flex; gap: 10px; align-items: center; margin: 10px 0 4px; }
.brow input[type=range] { flex: 1; min-width: 0; }
.pickbtn { width: 36px; height: 36px; flex: none; border-radius: 99px; border: 1px solid var(--line); background: #1a2233; cursor: pointer; padding: 3px; }
.pickbtn i { display: block; width: 100%; height: 100%; border-radius: 99px; background: conic-gradient(#f55, #fb0, #4d4, #4dd, #55f, #c6f, #f55); }
.ov { position: fixed; inset: 0; background: rgba(0,0,0,.62); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: #101827; border: 1px solid var(--line); border-radius: 16px 16px 0 0; width: 100%; max-width: 430px; padding: 14px 14px 20px; max-height: 82vh; overflow: auto; }
@media (min-width: 640px) { .ov { align-items: center; } .sheet { border-radius: 16px; } }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.tabs button { flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--mut); cursor: pointer; font-weight: 700; }
.tabs button.active { background: #243; color: #fff; }
.tabs button.x { flex: none; width: 42px; }
.satpad { position: relative; height: 120px; border-radius: 14px; cursor: pointer; touch-action: none; background: linear-gradient(to bottom, rgba(255,255,255,.95), rgba(255,255,255,0) 60%, rgba(0,0,0,.30)), linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
.hueknob { position: absolute; width: 26px; height: 26px; border-radius: 99px; border: 3px solid #fff; box-shadow: 0 1px 4px #0008; transform: translate(-50%, -50%); pointer-events: none; background: #f00; }
.pksw { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pksw .sw { width: 36px; height: 36px; }
#pk_addfav { display: flex; align-items: center; justify-content: center; font-size: 21px; color: #ff5a7a; background: #1a2233; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.card .top { display: flex; align-items: center; gap: 8px; }
.card .top b { font-size: 16px; }
.dot { width: 11px; height: 11px; border-radius: 99px; background: #22c55e; flex: none; }
.dot.off { background: #ef4444; }
.dot.unknown { background: #555; }
.top { cursor: pointer; }
.roomhead .rrow:first-child { cursor: pointer; }
.meta { color: var(--mut); font-size: 12px; margin: 4px 0 10px; }
.ctl { margin: 10px 0; }
.ctl label { display: flex; justify-content: space-between; font-size: 12px; color: var(--mut); margin-bottom: 4px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: pointer; --fill: 50%; }
input[type=range]::-webkit-slider-runnable-track { height: 18px; border-radius: 99px; background: linear-gradient(to right, #3b82f6 var(--fill), #2a3342 var(--fill)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 0; height: 0; border: none; }
input[type=range]::-moz-range-track { height: 18px; border-radius: 99px; background: #2a3342; }
input[type=range]::-moz-range-progress { height: 18px; border-radius: 99px; background: #3b82f6; }
input[type=range]::-moz-range-thumb { width: 0; height: 0; border: none; background: transparent; }
.seg { display: flex; background: #0c1220; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; margin: 8px 0; }
.seg button { flex: 1; padding: 7px; border-radius: 8px; border: none; background: transparent; color: var(--mut); cursor: pointer; font-weight: 600; }
.seg button.active { background: #243; color: #fff; }
.colorrow { display: flex; gap: 8px; align-items: center; }
.colorrow input[type=range] { flex: 1; min-width: 0; }
input[type=color] { width: 44px; height: 34px; border: none; border-radius: 8px; background: none; padding: 0; }
.sw { width: 28px; height: 28px; border-radius: 99px; border: 2px solid #ffffff22; cursor: pointer; }
details summary { cursor: pointer; color: var(--mut); font-size: 12px; }
details .row { display: flex; gap: 6px; margin-top: 8px; }
input[type=text] { width: 100%; background: #0c1220; color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
button.primary { padding: 9px 14px; border-radius: 10px; border: none; cursor: pointer; background: var(--acc); color: #fff; font-weight: 600; }
button.ghost { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--txt); cursor: pointer; }
.scenepanel { background: #0e1524; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 6px; }
.group { background: #0e1524; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.group h4 { margin: 0 0 8px; font-size: 14px; }
.scenepanel h3 { margin: 0 0 8px; font-size: 14px; }
.srow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.srow select, .srow input[type=text], .srow input[type=number] { background: #0c1220; color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
.srow input[type=number] { width: 70px; }
.sceneitem { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 6px 0; }
.sceneitem .nm { font-weight: 700; }
.sceneitem .tg { font-size: 12px; color: var(--mut); }
.stepdots { display: flex; gap: 4px; align-items: center; }
.stepdot { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--mut); }
.stepdot i { width: 16px; height: 16px; border-radius: 99px; display: inline-block; border: 1px solid #ffffff33; }
.steprow { display: flex; gap: 6px; align-items: center; margin: 4px 0; border: 1px solid transparent; border-top: 2px solid transparent; border-bottom: 2px solid transparent; border-radius: 8px; padding: 2px 4px; }
.steprow.dragging { opacity: .4; }
.steprow.dragover-top { border-top: 2px solid #3b82f6; }
.steprow.dragover-bot { border-bottom: 2px solid #3b82f6; }
.drag { cursor: grab; color: var(--mut); font-size: 16px; padding: 4px 2px; user-select: none; }
.drag:active { cursor: grabbing; }
.playing { outline: 2px solid #22c55e; }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <img src="wiz.svg" class="logo" alt="WiZ">
    <span id="pill">…</span>
  </div>
</header>
<main>
<section id="page-devices"><div id="lights"></div></section>
<section id="page-scenes" style="display:none">
<div class="scenepanel" id="scenepanel">
  <h3>🎬 Scenes <span class="muted" style="font-weight:400">definisi saja — cth: merah 1s → off 2s → biru 2s, loop. Play dari room / device di bawah.</span></h3>
  <div id="scenelist"></div>
  <div class="srow">
    <input type="text" id="sc_name" placeholder="nama scene" style="width:130px">
    <label class="muted"><input type="checkbox" id="sc_loop" checked> loop</label>
  </div>
  <div id="sc_steps"></div>
  <div class="srow">
    <button class="ghost" id="sc_add">+ step</button>
    <button class="primary" id="sc_save">💾 Simpan scene</button>
    <span class="muted" id="sc_msg"></span>
  </div>
</div>
</section>
<section id="page-settings" style="display:none">
  <div class="group">
    <h4>🔄 Sync</h4>
    <div class="muted" style="font-size:12px;margin-bottom:8px">hardware + room dari WiZ</div>
    <div class="srow"><button class="primary" id="sync_scan">🔍 Scan</button><button class="primary" id="sync_btn">⬇ Pull hardware</button><span class="muted" id="sync_msg"></span></div>
    <div class="muted" style="font-size:12px;margin:6px 0">Hardware memberi mac · roomId angka · module · firmware. Nama cantik dari export WiZ; tak dikenal → wiz-abcd.</div>
    <div id="hwlist"></div>
  </div>
</section>
</main>
<nav id="tabbar">
  <button data-nav="devices" class="active">📱<small>Devices</small></button>
  <button data-nav="scenes">🎬<small>Scenes</small></button>
  <button data-nav="settings">⚙️<small>Settings</small></button>
</nav>
<div class="ov" id="pickov" style="display:none">
  <div class="sheet">
    <div class="tabs">
      <button data-t="color" class="active">🎨 Color</button>
      <button data-t="scene">🎬 Scene</button>
      <button class="x" data-t="x">✕</button>
    </div>
    <div data-p="color">
      <div class="satpad" id="pk_hue"><div class="hueknob" id="pk_knob"></div></div>
      <div class="pksw" style="margin-top:10px">
        <span id="pk_builtins" style="display:contents">
          <div class="sw" id="pk_addfav" title="simpan warna ini ke favorit">❤</div>
          <div class="sw" style="background:#ff0000" data-c="#ff0000" title="red"></div>
          <div class="sw" style="background:#ffb020" data-c="#ffb020" title="orange"></div>
          <div class="sw" style="background:#ffd9a0" data-c="#ffd9a0" title="warm"></div>
          <div class="sw" style="background:#00ff00" data-c="#00ff00" title="green"></div>
          <div class="sw" style="background:#38bdf8" data-c="#38bdf8" title="sky"></div>
          <div class="sw" style="background:#0000ff" data-c="#0000ff" title="blue"></div>
          <div class="sw" style="background:#a78bfa" data-c="#a78bfa" title="purple"></div>
          <div class="sw" style="background:#ff2d78" data-c="#ff2d78" title="pink"></div>
        </span>
      </div>
      <div class="pksw" style="margin-top:8px">
        <span id="pk_favs" style="display:contents"></span>
      </div>
      <div class="muted" style="margin:12px 0 6px">CCT Color</div>
      <div class="pksw">
        <div class="sw" style="background:#ffbf80" data-w="2700" title="warm 2700K"></div>
        <div class="sw" style="background:#ffe0b8" data-w="4000" title="neutral 4000K"></div>
        <div class="sw" style="background:#eaf2ff" data-w="6500" title="daylight 6500K"></div>
      </div>
    </div>
    <div data-p="scene" style="display:none">
      <div id="pk_scenes"></div>
    </div>
  </div>
</div>
<script>
const box = document.getElementById('lights');
const pill = document.getElementById('pill');
const say = t => pill.textContent = t;
// subpath-aware: works at / and /app/ (reverse proxy)
const BASE = (location.pathname === '/app' || location.pathname.startsWith('/app/')) ? '/app' : '';
async function api(path, body) {
  const r = await fetch(BASE + path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, body ? { method: 'POST', body: JSON.stringify(body) } : {}));
  if (!r.ok) throw new Error('http ' + r.status + ' ' + path);
  return r.json();
}
let sendTimer = {};
function send(ip, params) {
  if (!ip) { say('offline — scan dulu'); return; }
  clearTimeout(sendTimer[ip]);
  sendTimer[ip] = setTimeout(async () => {
    say('kirim…');
    const r = await api('/api/pilot', { ip, method: 'setPilot', params });
    say(r.ok ? 'ok' : ('gagal: ' + (r.error || '?')));
  }, 180);
}
function card(l) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.devkey = 'dev:' + l.mac;
  const online = l.online !== false && !!l.ip;
  const p = l.pilot || {};
  const dim = p.dimming ?? 80;
  el.innerHTML = `
    <div class="top" data-a="toggle" title="on/off"><span class="dot ${!l.ip ? 'unknown' : (p.state === false ? 'off' : '')}"></span><b>${esc(l.name || l.mac)}</b></div>
    <div class="meta">${l.ip || 'offline'} · ${esc(l.mac)}${l.lastSeen ? ' · ' + l.lastSeen.slice(11, 16) : ''}</div>
    <div class="brow">
      <button class="pickbtn" data-a="pick" title="color / scene"><i></i></button>
      <input type="range" min="10" max="100" value="${dim}" style="--fill:${dim}%" data-a="dim">
    </div>
    <div class="meta" data-a="playing" style="display:none"></div>`;
  const q = s => el.querySelector(s);
  let on = p.state !== false;
  const paint = () => { q('.dot').className = 'dot ' + (!l.ip ? 'unknown' : (on ? '' : 'off')); };
  q('[data-a=toggle]').onclick = () => { on = !on; send(l.ip, { state: on }); paint(); };
  q('[data-a=dim]').oninput = e => { e.target.style.setProperty('--fill', e.target.value + '%'); send(l.ip, { state: true, dimming: +e.target.value }); };
  q('[data-a=pick]').onclick = () => openPicker({ type: 'device', mac: l.mac });
  if (!online) el.style.opacity = '.65';
  return el;
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function render(lights) {
  box.innerHTML = '';
  const rooms = {};
  lights.forEach(l => { (rooms[l.room || 'Lainnya'] = rooms[l.room || 'Lainnya'] || []).push(l); });
  Object.keys(rooms).sort().forEach(room => {
    const members = rooms[room];
    const wrap = document.createElement('div');
    wrap.className = 'room';
    wrap.dataset.roomkey = 'room:' + room;
    wrap.innerHTML = `
      <div class="roomhead">
        <div class="rrow" data-r="toggle" title="all on/off">
          <span class="dot" data-r="dot"></span>
          <span class="t">🏠 ${esc(room)}</span><span class="n">${members.length} lampu</span>
        </div>
        <div class="rrow">
          <button class="pickbtn" data-r="pick" title="color / scene"><i></i></button>
          <input type="range" min="10" max="100" value="80" style="--fill:80%" data-r="dim" title="brightness semua">
        </div>
      </div>
      <div class="meta" data-r="playing" style="display:none;margin:6px 2px 0"></div>`;
    const rq = s => wrap.querySelector(s);
    const targets = () => members.filter(m => m.ip);
    let roomOn = members.some(m => m.ip && (m.pilot || {}).state !== false);
    const paintR = () => { rq('[data-r=dot]').className = 'dot ' + (roomOn ? '' : 'off'); };
    paintR();
    rq('[data-r=toggle]').onclick = () => { roomOn = !roomOn; targets().forEach(m => send(m.ip, { state: roomOn })); paintR(); };
    rq('[data-r=dim]').oninput = e => { e.target.style.setProperty('--fill', e.target.value + '%'); targets().forEach(m => send(m.ip, { state: true, dimming: +e.target.value })); };
    rq('[data-r=pick]').onclick = () => openPicker({ type: 'room', room });
    const g = document.createElement('div'); g.className = 'grid';
    members.forEach(x => g.appendChild(card(x)));
    wrap.appendChild(g);
    box.appendChild(wrap);
  });
  refreshPicker();
  updatePlayingLabels();
  renderHw();
}
let cachedLights = [];
let cachedScenes = [];
let lastPlaying = {};
let editingSceneId = null;
function sceneName(id) { const s = cachedScenes.find(x => x.id === id); return s ? s.name : id; }
// --- color/scene picker popup (2 tabs), bound to a room or device target ---
let pkTarget = null;
let pkSyncT = null;
function pkKey() {
  if (!pkTarget) return null;
  return pkTarget.type === 'device' ? 'dev:' + pkTarget.mac : 'room:' + pkTarget.room;
}
function pkIps() {
  if (!pkTarget) return [];
  if (pkTarget.type === 'device') {
    const l = cachedLights.find(x => x.mac === pkTarget.mac);
    return l && l.ip ? [l.ip] : [];
  }
  return cachedLights.filter(l => (l.room || 'Lainnya') === pkTarget.room && l.ip).map(l => l.ip);
}
function hueHex(h) { // hue 0..360 -> full-saturation hex
  h = ((h % 360) + 360) % 360;
  const x = 1 - Math.abs((h / 60) % 2 - 1);
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = 1; g = x; }
  else if (h < 120) { r = x; g = 1; }
  else if (h < 180) { g = 1; b = x; }
  else if (h < 240) { g = x; b = 1; }
  else if (h < 300) { r = x; b = 1; }
  else { r = 1; b = x; }
  const t = v => Math.round(v * 255).toString(16).padStart(2, '0');
  return '#' + t(r) + t(g) + t(b);
}
let pkPad = { x: 0, y: 1 }; // x: hue 0..1, y: 0 top(white)..1 bottom(full)
function padHex(x, y) {
  const h = hueHex(x * 360);
  const r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
  const t = v => Math.round(v).toString(16).padStart(2, '0');
  return '#' + t(r * y + 255 * (1 - y)) + t(g * y + 255 * (1 - y)) + t(b * y + 255 * (1 - y));
}
function padFromEvent(e) {
  const r = document.getElementById('pk_hue').getBoundingClientRect();
  return {
    x: Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1),
    y: Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1),
  };
}
function setKnob() {
  const hex = padHex(pkPad.x, pkPad.y);
  const knob = document.getElementById('pk_knob');
  knob.style.left = (pkPad.x * 100) + '%';
  knob.style.top = (pkPad.y * 100) + '%';
  knob.style.background = hex;
  return hex;
}
// favorites: user colors in localStorage, built-ins can't be deleted
function loadFavs() { try { return JSON.parse(localStorage.getItem('pwiz_favs') || '[]'); } catch { return []; } }
function saveFavs(f) { try { localStorage.setItem('pwiz_favs', JSON.stringify(f.slice(0, 24))); } catch {} }
function pressHold(el, onTap, onHold) {
  let t = null, sx = 0, sy = 0, held = false;
  el.addEventListener('pointerdown', e => {
    held = false; sx = e.clientX; sy = e.clientY;
    t = setTimeout(() => { held = true; onHold(); }, 600);
  });
  el.addEventListener('pointermove', e => {
    if (t && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) { clearTimeout(t); t = null; }
  });
  const up = e => { if (t) { clearTimeout(t); t = null; } if (!held) onTap(e); };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', () => { if (t) { clearTimeout(t); t = null; } });
  el.addEventListener('contextmenu', e => e.preventDefault());
}
function renderFavs() {
  const box = document.getElementById('pk_favs');
  if (!box) return;
  box.innerHTML = '';
  loadFavs().forEach(hex => {
    const d = document.createElement('div');
    d.className = 'sw'; d.style.background = hex; d.title = hex + ' (tahan = hapus)';
    pressHold(d, () => pkApplyColor(hex), () => {
      saveFavs(loadFavs().filter(f => f !== hex));
      renderFavs(); say('🗑 favorit dihapus');
    });
    box.appendChild(d);
  });
}
function pkLabel() {
  if (!pkTarget) return '';
  if (pkTarget.type === 'device') {
    const l = cachedLights.find(x => x.mac === pkTarget.mac);
    return '💡 ' + (l ? (l.name || l.mac) : pkTarget.mac);
  }
  return '🏠 ' + pkTarget.room;
}
function pkStopIfPlaying() {
  // static wins: auto-stop any scene playing on this target so it can't overwrite
  if (lastPlaying[pkKey()]) {
    api('/api/scenes/stop', { target: pkTarget }); // fire-and-forget, kills the loop now
    delete lastPlaying[pkKey()];
    updatePlayingLabels(); renderPkScenes();
    clearTimeout(pkSyncT);
    pkSyncT = setTimeout(() => loadScenes(), 600); // reconcile once gesture settles
  }
}
function pkApplyColor(hex) {
  const ips = pkIps();
  if (!ips.length) { say('offline — scan dulu'); return; }
  pkStopIfPlaying();
  if (hex === '#000000') { ips.forEach(ip => send(ip, { state: false })); return; } // black = off
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  ips.forEach(ip => send(ip, { state: true, r, g, b }));
}
function pkApplyWhite(temp) {
  // true white = white LEDs via temp, NOT rgb 255,255,255 (that looks tinted/dim)
  const ips = pkIps();
  if (!ips.length) { say('offline — scan dulu'); return; }
  pkStopIfPlaying();
  ips.forEach(ip => send(ip, { state: true, temp }));
}
function openPicker(target) {
  pkTarget = target;
  showPkTab('color');
  renderPkScenes();
  document.getElementById('pickov').style.display = '';
}
function closePicker() { document.getElementById('pickov').style.display = 'none'; pkTarget = null; }
function showPkTab(t) {
  document.querySelectorAll('#pickov [data-t]').forEach(b => b.classList.toggle('active', b.dataset.t === t));
  document.querySelector('#pickov [data-p=color]').style.display = t === 'color' ? '' : 'none';
  document.querySelector('#pickov [data-p=scene]').style.display = t === 'scene' ? '' : 'none';
}
function renderPkScenes() {
  const el = document.getElementById('pk_scenes');
  if (!el || !pkTarget) return;
  const key = pkKey();
  const playingId = (lastPlaying[key] || {}).sceneId;
  if (!cachedScenes.length) { el.innerHTML = '<span class="muted">belum ada scene — buat di panel 🎬 atas.</span>'; return; }
  el.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'meta';
  head.textContent = pkLabel();
  el.appendChild(head);
  cachedScenes.forEach(s => {
    const isPlay = playingId === s.id;
    const row = document.createElement('div');
    row.className = 'sceneitem' + (isPlay ? ' playing' : '');
    row.innerHTML = `<span class="nm">${esc(s.name)}</span>
      <span class="stepdots">${s.steps.map(st => st.off ? `<span class="stepdot"><i style="background:#0a0a0a;border:1px dashed #888"></i>${st.secs}s OFF</span>` : `<span class="stepdot"><i style="background:${st.hex}"></i>${st.secs}s</span>`).join('')}</span>
      <span style="flex:1"></span>
      <button class="ghost">${isPlay ? '⏹ Stop' : '▶ Play'}</button>`;
    row.querySelector('button').onclick = async () => {
      const r = isPlay
        ? await api('/api/scenes/stop', { target: pkTarget })
        : await api('/api/scenes/play', { id: s.id, target: pkTarget });
      say(!r.ok && r.error ? ('gagal: ' + r.error) : (isPlay ? '⏹ stop' : '▶ ' + s.name));
      await loadScenes();
      renderPkScenes();
    };
    el.appendChild(row);
  });
}
function refreshPicker() { if (pkTarget) renderPkScenes(); }
function updatePlayingLabels() {
  document.querySelectorAll('.room').forEach(w => {
    const pl = lastPlaying[w.dataset.roomkey];
    const el = w.querySelector('[data-r=playing]');
    if (!el) return;
    if (pl) { el.style.display = ''; el.textContent = '▶ ' + sceneName(pl.sceneId); }
    else el.style.display = 'none';
  });
  document.querySelectorAll('.card').forEach(c => {
    const pl = lastPlaying[c.dataset.devkey];
    const el = c.querySelector('[data-a=playing]');
    if (!el) return;
    if (pl) { el.style.display = ''; el.textContent = '▶ ' + sceneName(pl.sceneId); }
    else el.style.display = 'none';
  });
}
let dragRow = null;
function scStepRow(hex = '#ff0000', secs = 1, off = false) {
  const d = document.createElement('div');
  d.className = 'steprow';
  d.innerHTML = `<span class="drag" draggable="true" title="drag to reorder">⠿</span><input type="color" value="${hex}"><input type="number" min="0.2" max="3600" step="0.1" value="${secs}" title="detik"> <span class="muted">detik</span> <label class="muted"><input type="checkbox" ${off ? 'checked' : ''} data-off> off</label> <button class="ghost" data-mv="-1" title="atas">▲</button><button class="ghost" data-mv="1" title="bawah">▼</button> <button class="ghost" data-del>✕</button>`;
  d.querySelector('[data-del]').onclick = () => d.remove();
  d.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
    const sib = +b.dataset.mv < 0 ? d.previousElementSibling : d.nextElementSibling;
    if (!sib || !sib.classList.contains('steprow')) return;
    d.parentNode.insertBefore(d, +b.dataset.mv < 0 ? sib : sib.nextElementSibling);
  });
  // off = black: set color to #000 while off, restore previous on uncheck
  const colorEl = d.querySelector('input[type=color]');
  d.querySelector('[data-off]').onchange = e => {
    if (e.target.checked) { colorEl.dataset.prev = colorEl.value; colorEl.value = '#000000'; colorEl.disabled = true; }
    else { colorEl.value = colorEl.dataset.prev || '#ffffff'; colorEl.disabled = false; }
  };
  if (off) { colorEl.dataset.prev = (hex && hex !== '#000000') ? hex : '#ffffff'; colorEl.value = '#000000'; colorEl.disabled = true; }
  const h = d.querySelector('.drag');
  h.ondragstart = e => { e.dataTransfer.setData('text/plain', 'step'); e.dataTransfer.effectAllowed = 'move'; dragRow = d; setTimeout(() => d.classList.add('dragging')); };
  h.ondragend = () => { d.classList.remove('dragging'); document.querySelectorAll('#sc_steps .steprow').forEach(r => r.classList.remove('dragover-top', 'dragover-bot')); dragRow = null; };
  d.ondragover = e => {
    if (!dragRow || dragRow === d) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    const r = d.getBoundingClientRect(), after = (e.clientY - r.top) > r.height / 2;
    d.classList.toggle('dragover-top', !after); d.classList.toggle('dragover-bot', after); d._after = after;
  };
  d.ondragleave = () => d.classList.remove('dragover-top', 'dragover-bot');
  d.ondrop = e => {
    e.preventDefault(); e.stopPropagation();
    if (!dragRow || dragRow === d) return;
    d.parentNode.insertBefore(dragRow, d._after ? d.nextElementSibling : d);
    d.classList.remove('dragover-top', 'dragover-bot');
  };
  return d;
}
function getEditorSteps() {
  return [...document.querySelectorAll('#sc_steps .steprow')].map(r => ({
    hex: r.querySelector('input[type=color]').value,
    secs: Math.max(0.2, +r.querySelector('input[type=number]').value || 1),
    off: r.querySelector('[data-off]').checked,
  }));
}
async function loadScenes() {
  try {
    const d = await api('/api/scenes');
    renderScenes(d.scenes || [], d.playing || []);
  } catch (e) { document.getElementById('scenelist').innerHTML = '<span class="muted">gagal load scenes</span>'; }
}
function renderScenes(scenes, playing) {
  cachedScenes = scenes || [];
  lastPlaying = playing || {};
  const el = document.getElementById('scenelist');
  if (!scenes.length) { el.innerHTML = '<span class="muted">belum ada scene — cth: merah 1s → off 2s → biru 2s, loop.</span>'; }
  else {
    el.innerHTML = '';
    scenes.forEach(s => {
      const onWhere = Object.entries(lastPlaying).filter(([, p]) => p.sceneId === s.id).map(([k]) => {
        if (k.startsWith('dev:')) { const l = cachedLights.find(x => x.mac === k.slice(4)); return '💡 ' + (l ? (l.name || l.mac) : k.slice(4)); }
        return '🏠 ' + k.slice(5);
      });
      const row = document.createElement('div');
      row.className = 'sceneitem' + (onWhere.length ? ' playing' : '');
      row.innerHTML = `<span class="nm">${esc(s.name)}</span><span class="tg">${s.loop === false ? 'sekali' : 'loop'}${onWhere.length ? ' · ▶ ' + esc(onWhere.join(', ')) : ''}</span>
      <span class="stepdots">${s.steps.map(st => st.off ? `<span class="stepdot"><i style="background:#0a0a0a;border:1px dashed #888"></i>${st.secs}s OFF</span>` : `<span class="stepdot"><i style="background:${st.hex}"></i>${st.secs}s</span>`).join('')}</span>
      <span style="flex:1"></span>
      <button class="ghost" data-s="edit">✏️</button>
      <button class="ghost" data-s="del">🗑</button>`;
      row.querySelector('[data-s=del]').onclick = async () => { await api('/api/scenes/delete', { id: s.id }); loadScenes(); };
      row.querySelector('[data-s=edit]').onclick = () => {
        editingSceneId = s.id;
        document.getElementById('sc_name').value = s.name;
        document.getElementById('sc_loop').checked = s.loop !== false;
        const box = document.getElementById('sc_steps'); box.innerHTML = '';
        s.steps.forEach(st => box.appendChild(scStepRow(st.hex, st.secs, st.off)));
        document.getElementById('sc_msg').textContent = 'edit mode — simpan untuk update';
        document.getElementById('scenepanel').scrollIntoView({ behavior: 'smooth' });
      };
      el.appendChild(row);
    });
  }
  refreshPicker();
  updatePlayingLabels();
  renderHw();
}
function nav(p) {
  ['devices', 'scenes', 'settings'].forEach(k => { document.getElementById('page-' + k).style.display = k === p ? '' : 'none'; });
  document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('active', b.dataset.nav === p));
  if (p === 'scenes') loadScenes();
  if (p === 'settings') renderHw();
}
function renderHw() {
  const el = document.getElementById('hwlist');
  if (!el) return;
  if (!cachedLights.length) { el.innerHTML = '<span class="muted">kosong — pull dulu.</span>'; return; }
  el.innerHTML = '';
  cachedLights.forEach(l => {
    const sys = l.sys || {};
    const row = document.createElement('div');
    row.className = 'sceneitem';
    row.innerHTML = `<span class="nm">${esc(l.name || l.mac)}</span>
      <span class="tg">${l.ip || 'offline'} · ${esc(l.mac)}</span>
      <span class="stepdots"><span class="stepdot">🏠 ${esc(l.room || '?')}${sys.roomId ? ' · id ' + sys.roomId : ''}</span>
      <span class="stepdot">${esc(sys.module || '?')} · fw ${esc(sys.fw || '?')}</span></span>`;
    el.appendChild(row);
  });
}
async function loadLights(show = true) {
  try { if (show) say('memuat cache…'); const d = await api('/api/lights'); cachedLights = d.lights || []; render(cachedLights); if (show) say('cache ok'); }
  catch (e) { say('gagal load: ' + (e.message || e)); }
}
async function scan(silent = false) {
  if (!silent) say('scan…');
  try { const d = await api('/api/discover'); cachedLights = d.lights || []; render(cachedLights); say('synced 🟢'); }
  catch (e) { if (!silent) say('scan gagal: ' + (e.message || e)); }
}
document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => nav(b.dataset.nav));
document.getElementById('sync_scan').onclick = () => scan(false);
document.getElementById('sync_btn').onclick = async () => {
  document.getElementById('sync_msg').textContent = 'pull…';
  await scan(true);
  renderHw();
  document.getElementById('sync_msg').textContent = cachedLights.length + ' devices ✓';
};
document.querySelectorAll('#pickov [data-t]').forEach(b => b.onclick = () => {
  if (b.dataset.t === 'x') closePicker();
  else showPkTab(b.dataset.t);
});
document.getElementById('pickov').onclick = e => { if (e.target.id === 'pickov') closePicker(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });
let hueDrag = false;
const hueBar = document.getElementById('pk_hue');
function padDown(e) { pkPad = padFromEvent(e); setKnob(); }
hueBar.addEventListener('pointerdown', e => { hueDrag = true; try { hueBar.setPointerCapture(e.pointerId); } catch {} padDown(e); });
hueBar.addEventListener('pointermove', e => { if (hueDrag) padDown(e); });
hueBar.addEventListener('pointerup', e => { if (!hueDrag) return; hueDrag = false; padDown(e); pkApplyColor(setKnob()); });
hueBar.addEventListener('pointercancel', () => hueDrag = false);
setKnob();
document.querySelectorAll('#pk_builtins .sw[data-c]').forEach(s => pressHold(s, () => pkApplyColor(s.dataset.c), () => say('warna bawaan — tidak bisa dihapus')));
document.getElementById('pk_addfav').onclick = () => {
  const hex = padHex(pkPad.x, pkPad.y);
  const favs = loadFavs();
  if (favs.includes(hex)) { say('sudah ada di favorit'); return; }
  favs.push(hex); saveFavs(favs); renderFavs(); say('❤ tersimpan');
};
renderFavs();
document.querySelectorAll('#pickov [data-w]').forEach(s => s.onclick = () => pkApplyWhite(+s.dataset.w));
document.getElementById('sc_add').onclick = () => document.getElementById('sc_steps').appendChild(scStepRow());
document.getElementById('sc_save').onclick = async () => {
  const steps = getEditorSteps();
  if (!steps.length) { document.getElementById('sc_msg').textContent = 'tambah min 1 step'; return; }
  const body = { name: document.getElementById('sc_name').value || 'scene', steps, loop: document.getElementById('sc_loop').checked };
  if (editingSceneId) body.id = editingSceneId;
  const r = await api('/api/scenes', body);
  document.getElementById('sc_msg').textContent = r.ok ? 'tersimpan ✓' : 'gagal';
  editingSceneId = null;
  loadScenes();
};
// default example: 1s red -> 2s blue
document.getElementById('sc_steps').appendChild(scStepRow('#ff0000', 1));
document.getElementById('sc_steps').appendChild(scStepRow('#0000ff', 2));
loadLights(true).then(() => scan(true));
loadScenes();
</script>
